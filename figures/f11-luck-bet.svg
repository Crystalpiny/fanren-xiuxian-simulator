<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" role="img">
<title>机缘押注表（TZ-0028）</title>
<desc>三档押注力度 × 五档机缘档位。档位明（面板显示）+ 机缘骰消耗暗（天道记账）。</desc>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
.t{font-size:17px;font-weight:600;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.n{font-size:13px;font-weight:600;fill:#2C2C2A}
.cell{font-size:17px;font-weight:600;fill:#2C2C2A}
.hdr{font-size:13px;font-weight:600;fill:#2C2C2A}
.hint{font-size:11px;fill:#5F5E5A}
.pos{font-size:17px;font-weight:600;fill:#0C447C}
.neg{font-size:17px;font-weight:600;fill:#A32D2D}
</style>

<text class="t" x="30" y="32">机缘押注表（TZ-0028 起严格执行）</text>
<text class="s" x="30" y="54">机缘不可刷数值，但可以下注。三档力度 × 五档机缘档位，档位明（面板显示）+ 机缘骰消耗暗（天道记账）。</text>

<!-- 列标题 -->
<text class="hdr" x="380" y="98" text-anchor="middle">轻押 ×1.0</text>
<text class="hdr" x="590" y="98" text-anchor="middle">重押 ×2.4</text>
<text class="hdr" x="800" y="98" text-anchor="middle">孤注 ×4.2</text>
<text class="hint" x="380" y="114" text-anchor="middle">机缘骰 −1</text>
<text class="hint" x="590" y="114" text-anchor="middle">机缘骰 −2</text>
<text class="hint" x="800" y="114" text-anchor="middle">机缘骰 −3　失败惩罚 ×1.5</text>

<!-- 行标签 + 单元格 -->
<text class="n" x="186" y="152" text-anchor="end">大顺　9~10</text>
<rect x="260" y="132" width="240" height="36" fill="#F2C879"/>
<rect x="500" y="132" width="180" height="36" fill="#E8B44B"/>
<rect x="680" y="132" width="240" height="36" fill="#D89A2B"/>
<text class="pos" x="380" y="157" text-anchor="middle">+15</text>
<text class="pos" x="590" y="157" text-anchor="middle">+35</text>
<text class="pos" x="800" y="157" text-anchor="middle">+60</text>
<text class="hint" x="940" y="157">诸事顺遂</text>

<text class="n" x="186" y="202" text-anchor="end">顺　7~8</text>
<rect x="260" y="182" width="240" height="36" fill="#FBE7C0"/>
<rect x="500" y="182" width="180" height="36" fill="#F2D694"/>
<rect x="680" y="182" width="240" height="36" fill="#E8BF6A"/>
<text class="pos" x="380" y="207" text-anchor="middle">+8</text>
<text class="pos" x="590" y="207" text-anchor="middle">+18</text>
<text class="pos" x="800" y="207" text-anchor="middle">+32</text>
<text class="hint" x="940" y="207">诸事顺遂</text>

<text class="n" x="186" y="252" text-anchor="end">平　4~6</text>
<rect x="260" y="232" width="240" height="36" fill="#EDECE7"/>
<rect x="500" y="232" width="180" height="36" fill="#E2E0D9"/>
<rect x="680" y="232" width="240" height="36" fill="#D6D4CC"/>
<text class="cell" x="380" y="257" text-anchor="middle">+2</text>
<text class="cell" x="590" y="257" text-anchor="middle">+5</text>
<text class="cell" x="800" y="257" text-anchor="middle">+9</text>
<text class="hint" x="940" y="257">平平</text>

<text class="n" x="186" y="302" text-anchor="end">背　2~3</text>
<rect x="260" y="282" width="240" height="36" fill="#E8C5C0"/>
<rect x="500" y="282" width="180" height="36" fill="#DCA8A0"/>
<rect x="680" y="282" width="240" height="36" fill="#CC8880"/>
<text class="neg" x="380" y="307" text-anchor="middle">−8</text>
<text class="neg" x="590" y="307" text-anchor="middle">−18</text>
<text class="neg" x="800" y="307" text-anchor="middle">−32</text>
<text class="hint" x="940" y="307">心神不宁</text>

<text class="n" x="186" y="352" text-anchor="end">大背　0~1</text>
<rect x="260" y="332" width="240" height="36" fill="#DCA8A0"/>
<rect x="500" y="332" width="180" height="36" fill="#CC8880"/>
<rect x="680" y="332" width="240" height="36" fill="#A32D2D"/>
<text class="neg" x="380" y="357" text-anchor="middle">−15</text>
<text class="neg" x="590" y="357" text-anchor="middle">−35</text>
<text x="800" y="357" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">−60</text>
<text class="hint" x="940" y="357">心神不宁</text>

<!-- 分隔 -->
<line x1="200" y1="392" x2="1033" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- 规则要点 -->
<text class="n" x="200" y="418">规则要点</text>
<g class="s">
<text x="200" y="440">1. 押注不限次数——机缘骰衰减就是自然限制（连押三次 −3，见《规则补遗》六·4）</text>
<text x="200" y="460">2. 押注档位明（面板显示「诸事顺遂 / 平平 / 心神不宁」），机缘骰消耗暗（天道记账，玩家看不到数值）</text>
<text x="200" y="480">3. 孤注失败惩罚 ×1.5——重注的代价更大，不是稳赚</text>
<text x="200" y="500">4. 逆押（机缘 ≤3 时声明"逆势而上" + 真冒险行动）：成功机缘骰 +2，失败 −2。不吃押注加成</text>
<text x="200" y="520">5. 机缘必有代价：机缘 ≥8 的高额押注，触发代价事件骰，在对应场景就地兑现</text>
</g>
<text class="hint" x="30" y="548">数值设计意图：押注档位明、消耗暗——把"防刷"和"可玩性"从二选一变成一明一暗。</text>
</svg>
