<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" role="img">
<title>五大关口突破成功率</title>
<desc>炼气至化神五大关口的基础成功率，以及叠加额外项后的理论上限。</desc>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
.t{font-size:15px;font-weight:500;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.n{font-size:13px;fill:#2C2C2A}
.v{font-size:12px;fill:#FFFFFF}
</style>
<text class="t" x="30" y="32">突破成功率悬崖</text>
<text class="s" x="30" y="52">实心＝基础成功率　虚线框＝叠加额外项后的理论上限（额外项合计最多 +60%，总成功率封顶 95%、下限 5%）</text>

<line x1="200" y1="72" x2="200" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>
<g class="s" font-size="11" fill="#888780">
<text x="200" y="406" text-anchor="middle">0</text>
<text x="340" y="406" text-anchor="middle">20%</text>
<text x="480" y="406" text-anchor="middle">40%</text>
<text x="620" y="406" text-anchor="middle">60%</text>
<text x="760" y="406" text-anchor="middle">80%</text>
<text x="900" y="406" text-anchor="middle">95%</text>
</g>
<line x1="340" y1="72" x2="340" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="480" y1="72" x2="480" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="620" y1="72" x2="620" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="760" y1="72" x2="760" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="900" y1="72" x2="900" y2="392" stroke="#D3D1C7" stroke-width="0.5"/>

<text class="n" x="186" y="98" text-anchor="end">炼气层</text>
<rect x="200" y="84" width="350" height="28" rx="4" fill="#639922"/>
<text class="v" x="375" y="98" text-anchor="middle">50%</text>
<rect x="200" y="84" width="665" height="28" rx="4" fill="none" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="880" y="98">＋根骨×3% ＋灵根速度修正（天 +50 ／ 五 −40）</text>

<text class="n" x="186" y="146" text-anchor="end">筑基</text>
<rect x="200" y="132" width="140" height="28" rx="4" fill="#EF9F27"/>
<text class="v" x="270" y="146" text-anchor="middle">20%</text>
<rect x="200" y="132" width="560" height="28" rx="4" fill="none" stroke="#854F0B" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="775" y="146">＋灵根修正（天 +50 ／ 五 −30）　硬条件：炼气十一层以上</text>

<text class="n" x="186" y="194" text-anchor="end">结丹</text>
<rect x="200" y="180" width="70" height="28" rx="4" fill="#D85A30"/>
<text class="v" x="235" y="194" text-anchor="middle">10%</text>
<rect x="200" y="180" width="490" height="28" rx="4" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="705" y="194">无灵根修正　失败倒退一个小境界</text>

<text class="n" x="186" y="242" text-anchor="end">元婴</text>
<rect x="200" y="228" width="21" height="28" rx="4" fill="#E24B4A"/>
<text class="v" x="216" y="242" text-anchor="middle" font-size="11">3%</text>
<rect x="200" y="228" width="441" height="28" rx="4" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="656" y="242">＋三九雷劫（低于 30 形神俱灭）</text>

<text class="n" x="186" y="290" text-anchor="end">化神</text>
<rect x="200" y="276" width="7" height="28" rx="2" fill="#A32D2D"/>
<rect x="200" y="276" width="427" height="28" rx="4" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="s" x="215" y="290">1%</text>
<text class="s" x="642" y="290">＋六九雷劫（低于 20 身死道消）　人界只能停在化神初期巅峰</text>

<line x1="200" y1="330" x2="900" y2="330" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="s" x="200" y="352">额外项只含悟性、丹药、阵法、机缘四项，从高到低计入；基础成功率与灵根修正不占这顶帽子</text>
<text class="s" x="200" y="372">筑基丹按品级：下品 +15%　中品 +25%　上品 +35%　极品 +45%，只算最好的一枚</text>
<text class="s" x="200" y="392">硬条件不足一律不投骰，也不吃 5% 下限</text>
<text class="s" x="30" y="440">注：元婴、化神的天劫修正单独计算，不占突破额外帽，渡劫失败必死</text>
</svg>
