<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" role="img">
<title>战斗三步定式（TZ-0028）</title>
<desc>战力比 → 档位（目标阈值）→ 三档结局。四类调整明码标价，合计 +25~−25。战后必结算四件事。</desc>
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
.t{font-size:17px;font-weight:600;fill:#2C2C2A}
.s{font-size:12px;fill:#5F5E5A}
.n{font-size:13px;font-weight:600;fill:#2C2C2A}
.v{font-size:13px;fill:#FFFFFF}
.thr{font-size:15px;font-weight:600;fill:#2C2C2A}
.hint{font-size:11px;fill:#5F5E5A}
.step{font-size:13px;font-weight:600;fill:#2C2C2A}
</style>

<text class="t" x="30" y="32">战斗三步定式（TZ-0028 起严格执行）</text>
<text class="s" x="30" y="54">不再靠主持临时拿捏难度——战力比决定档位，档位决定目标阈值，四类调整明码标价，战后必结算四件事。</text>

<!-- 三步流程 -->
<rect x="200" y="80" width="200" height="46" rx="6" fill="#EDECE7" stroke="#888780" stroke-width="1"/>
<text class="step" x="300" y="99" text-anchor="middle">① 算战力比</text>
<text class="hint" x="300" y="117" text-anchor="middle">己方战力 / 敌方战力</text>
<text x="425" y="108" font-size="22" fill="#888780" text-anchor="middle">▶</text>
<rect x="450" y="80" width="220" height="46" rx="6" fill="#EDECE7" stroke="#888780" stroke-width="1"/>
<text class="step" x="560" y="99" text-anchor="middle">② 定档位 + 调整</text>
<text class="hint" x="560" y="117" text-anchor="middle">档位给阈值，调整 ±25</text>
<text x="695" y="108" font-size="22" fill="#888780" text-anchor="middle">▶</text>
<rect x="720" y="80" width="200" height="46" rx="6" fill="#EDECE7" stroke="#888780" stroke-width="1"/>
<text class="step" x="820" y="99" text-anchor="middle">③ 投骰得结局</text>
<text class="hint" x="820" y="117" text-anchor="middle">胜 / 胜有代价 / 负</text>

<!-- 档位表 -->
<text class="n" x="30" y="166">档位表（战力比 → 目标阈值）</text>
<line x1="200" y1="180" x2="1033" y2="180" stroke="#D3D1C7" stroke-width="0.5"/>

<g>
<rect x="200" y="186" width="833" height="30" fill="#F2C879"/>
<text class="hint" x="215" y="206">战力比 ≥ 3.0</text>
<text class="n" x="380" y="206">碾压</text>
<text class="thr" x="560" y="206">不投骰，直接胜</text>
<text class="hint" x="760" y="206">战力差三倍以上，无悬念</text>
</g>
<g>
<rect x="200" y="220" width="833" height="30" fill="#E4F1D8"/>
<text class="hint" x="215" y="240">战力比 2.0 ~ 2.9</text>
<text class="n" x="380" y="240">优势</text>
<text class="thr" x="560" y="240">目标 ≤ 90</text>
<text class="hint" x="760" y="240">几乎稳赢，伤势轻</text>
</g>
<g>
<rect x="200" y="254" width="833" height="30" fill="#E4F1D8"/>
<text class="hint" x="215" y="274">战力比 1.3 ~ 1.9</text>
<text class="n" x="380" y="274">上风</text>
<text class="thr" x="560" y="274">目标 ≤ 75</text>
<text class="hint" x="760" y="274">大概率赢，但消耗大</text>
</g>
<g>
<rect x="200" y="288" width="833" height="30" fill="#EDECE7"/>
<text class="hint" x="215" y="308">战力比 0.8 ~ 1.2</text>
<text class="n" x="380" y="308">均势</text>
<text class="thr" x="560" y="308">目标 ≤ 55</text>
<text class="hint" x="760" y="308">五五开，胜也多半带伤</text>
</g>
<g>
<rect x="200" y="322" width="833" height="30" fill="#FBE7C0"/>
<text class="hint" x="215" y="342">战力比 0.5 ~ 0.7</text>
<text class="n" x="380" y="342">劣势</text>
<text class="thr" x="560" y="342">目标 ≤ 35</text>
<text class="hint" x="760" y="342">越阶战典型档位</text>
</g>
<g>
<rect x="200" y="356" width="833" height="30" fill="#E8C5C0"/>
<text class="hint" x="215" y="376">战力比 0.3 ~ 0.4</text>
<text class="n" x="380" y="376">苦战</text>
<text class="thr" x="560" y="376">目标 ≤ 15</text>
<text class="hint" x="760" y="376">必有代价，多半要跑</text>
</g>
<g>
<rect x="200" y="390" width="833" height="30" fill="#DCA8A0"/>
<text class="hint" x="215" y="410">战力比 &lt; 0.3</text>
<text class="n" x="380" y="410">碾压（反向）</text>
<text class="thr" x="560" y="410">不投骰，直接负</text>
<text class="hint" x="760" y="410">除非有秘技禁术外力</text>
</g>

<!-- 分隔 -->
<line x1="200" y1="434" x2="1033" y2="434" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- 四类调整 -->
<text class="n" x="200" y="460">四类调整（明码，合计 +25 ~ −25）</text>
<g class="s">
<text x="200" y="482">地利　±10</text>
<text x="200" y="502">　阵法内 +10 / 设伏 +10 / 被伏 −10 / 悬崖绝地 −10</text>
<text x="420" y="482">状态　+8 ~ −15</text>
<text x="420" y="502">　满状态 +8 / 带伤 −5~−15 / 灵力将尽 −15</text>
<text x="680" y="482">人数　+15 ~ −5</text>
<text x="680" y="502">　以多打少 +15 / 单挑同阶 0 / 被围 −5~−15</text>
<text x="920" y="482">战术　±10</text>
<text x="920" y="502">　占先机 +10 / 被克制 −10</text>
</g>

<line x1="200" y1="522" x2="1033" y2="522" stroke="#D3D1C7" stroke-width="0.5"/>

<!-- 三档结局 -->
<text class="n" x="200" y="548">三档结局</text>
<g class="s">
<text x="200" y="570">胜（投中且有余裕）：战后四件套 = 伤势 / 战利品 / 人际（结仇·失友·恩义）/ 声名±X 尘缘±X</text>
<text x="200" y="590">胜有代价（投中但踩边）：多加一项负面（伤势加重 / 战利品残缺 / 仇家逃走留下后患）</text>
<text x="200" y="610">负：直接结算损失（重伤 / 丢宝 / 声名跌 / 被俘 / 逃跑欠因果）；大成功 ≤5 越一档，大失败 ≥96 降一档</text>
</g>
<text class="hint" x="30" y="640">补全版「十七之一」~「十七之七」另有战力估算公式、境界基数表、越阶手段七类（符宝/阵法/群战/法宝品阶差/妖兽神通/秘技禁术/外力）。</text>
</svg>
